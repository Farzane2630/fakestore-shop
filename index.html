<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Shop</h1>
      <nav aria-label="Cart">
        <span
          >Cart: <span id="cart-count">0</span> items · $<span id="cart-total"
            >0.00</span
          ></span
        >
      </nav>
    </header>
    <main>
      <section class="controls" aria-labelledby="controls-heading">
        <h2 id="controls-heading" class="visually-hidden">Filters</h2>

        <label for="search">Search products</label>
        <input type="search" id="search" placeholder="Search by title" />

        <label for="category">Category</label>
        <select id="category">
          <option value="all">All categories</option>
        </select>

        <label for="sort">Sort by price</label>
        <select id="sort">
          <option value="default">Default</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </section>

      <section aria-labelledby="products-heading">
        <h2 id="products-heading" class="visually-hidden">Products</h2>
        <p id="status" role="status"></p>
        <ul id="product-grid"></ul>
      </section>
    </main>

    <footer>
      <p>Data from Fake Store API</p>
    </footer>

    <dialog id="product-modal">
      <div class="modal-content">
        <button type="button" id="modal-close" aria-label="Close">×</button>
        <div id="modal-image-frame" class="modal-image-frame">
          <img id="modal-image" alt="" />
        </div>
        <h2 id="modal-title"></h2>
        <p id="modal-category"></p>
        <p id="modal-price"></p>
        <p id="modal-description"></p>
        <button type="button" id="add-to-cart">Add to cart</button>
      </div>
    </dialog>

    <script src="script.js" defer></script>
  </body>
</html>
